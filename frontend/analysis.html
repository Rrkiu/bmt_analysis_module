<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎥 실시간 비디오 분석</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="analysis.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎥 실시간 비디오 분석</h1>
            <p>배드민턴 코트 영역 오버레이</p>
        </header>

        <main class="analysis-main">
            <!-- 비디오 플레이어 섹션 -->
            <section class="video-section">
                <div class="video-container">
                    <canvas id="videoCanvas"></canvas>
                    <video id="videoPlayer" style="display: none;" crossorigin="anonymous"></video>
                </div>

                <!-- 비디오 컨트롤 -->
                <div class="video-controls">
                    <button id="playPauseBtn" class="control-btn" onclick="togglePlayPause()">
                        <span id="playIcon">▶️</span>
                        <span id="pauseIcon" style="display: none;">⏸️</span>
                    </button>
                    <input type="range" id="seekBar" class="seek-bar" value="0" step="0.1">
                    <span id="timeDisplay">00:00 / 00:00</span>
                    <button class="control-btn" onclick="toggleFullscreen()">⛶</button>
                </div>

                <!-- 속도 및 설정 -->
                <div class="video-settings">
                    <label>
                        재생 속도:
                        <select id="playbackRate" onchange="changePlaybackRate()">
                            <option value="0.25">0.25x</option>
                            <option value="0.5">0.5x</option>
                            <option value="1" selected>1x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                    </label>

                    <label>
                        표시 모드:
                        <select id="displayMode" onchange="changeDisplayMode()">
                            <option value="normal">일반 (코트만)</option>
                            <option value="debug" selected>디버그 (상세)</option>
                        </select>
                    </label>

                    <label>
                        <input type="checkbox" id="showOverlay" checked onchange="toggleOverlay()">
                        오버레이 표시
                    </label>
                </div>
            </section>

            <!-- 정보 패널 -->
            <aside class="info-panel">
                <h3>📊 분석 정보</h3>

                <div class="info-group">
                    <h4>비디오 정보</h4>
                    <div id="videoInfo" class="info-content">
                        <p>로딩 중...</p>
                    </div>
                </div>

                <div class="info-group">
                    <h4>캘리브레이션</h4>
                    <div id="calibrationInfo" class="info-content">
                        <p>로딩 중...</p>
                    </div>
                </div>

                <div class="info-group">
                    <h4>코너 좌표</h4>
                    <div id="cornerInfo" class="info-content">
                        <p>🟢 TL: <span id="cornerTL">-</span></p>
                        <p>🔵 TR: <span id="cornerTR">-</span></p>
                        <p>🔴 BR: <span id="cornerBR">-</span></p>
                        <p>🟡 BL: <span id="cornerBL">-</span></p>
                    </div>
                </div>

                <div class="info-group">
                    <h4>📈 통계 (Phase 4)</h4>
                    <div class="info-content">
                        <p style="color: #666;">셔틀콕 추적 기능 준비 중</p>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="goBack()">
                        ← 돌아가기
                    </button>
                    <button class="btn btn-primary" onclick="downloadVideo()">
                        💾 비디오 저장
                    </button>
                </div>
            </aside>
        </main>

        <!-- 로딩 오버레이 -->
        <div id="loadingOverlay" class="loading-overlay">
            <div class="spinner"></div>
            <p>비디오 로딩 중...</p>
        </div>
    </div>

    <script src="analysis.js?v=10"></script>
</body>

</html>
